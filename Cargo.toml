[package]
name = "bendy-fs-server"
version = "0.1.0"
edition = "2021"
description = "Universal file storage proxy (S3/Dufs/Redis) on Cloudflare Workers (Rust/WASM)"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.6", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
uuid = { version = "1", features = ["v4", "js"] }
web-time = "1"
console_error_panic_hook = "0.1"
